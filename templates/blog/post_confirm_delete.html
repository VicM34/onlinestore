{% extends "catalog/base.html" %}

{% block title %}Удаление статьи - Блог{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="card">
        <div class="card-body">
            <h1 class="mb-4">Подтверждение удаления</h1>
            
            <p>Вы уверены, что хотите удалить статью "{{ object.title }}"?</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
