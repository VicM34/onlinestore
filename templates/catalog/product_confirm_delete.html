{% extends "catalog/base.html" %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Подтверждение удаления</h3>
                </div>
                <div class="card-body">
                    <p class="fs-5">Вы уверены, что хотите удалить продукт:</p>
                    <p class="fs-4 fw-bold text-danger">{{ object.name }}</p>
                    
                    {% if object.image %}
                    <div class="text-center my-3">
                        <img src="{{ object.image.url }}" alt="{{ object.name }}" class="img-fluid rounded" style="max-height: 200px;">
                    </div>
                    {% endif %}
                    
                    <p class="text-muted">Это действие невозможно отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Удалить продукт
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
